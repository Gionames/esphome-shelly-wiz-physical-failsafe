#
# Shelly 2PM Gen4 — full model config: two relays, two switch inputs, button,
# status LED, ADE7953 two-channel power metering, and the onboard NTC.
#

substitutions:
  device_name: "shelly-2pm-gen4"
  friendly_name: "Shelly 2PM Gen4"
  relay_mode: "Latch"     # Latch or Momentary; starting value for both channels
  relay_pulse: "500 ms"   # Pulse length in Momentary mode; starting value for both channels
  relay_restore: "RESTORE_DEFAULT_OFF" # Relay power-on behavior (RESTORE_DEFAULT_ON, ALWAYS_OFF, ALWAYS_ON, ...)
  input_mode: "Pulsante: ogni pressione commuta l'uscita (Momentary)" # initial Input Mode of the input of both channels (Flip, Momentary, Follow, Activate, Detached); same behaviour as upstream "Linked"
  input_debounce_ms: "50" # initial switch input debounce, ms (runtime number)
  log_level: "INFO" # Logger verbosity (DEBUG, VERBOSE for troubleshooting)
  factory_reset_hold: "5s" # Button hold time before factory reset
  power_update_interval: "10s" # How often the power meter publishes
  ntc_b_constant: "3350" # NTC beta value, estimated
  # metering calibration, measured on this board against a reference meter at a ~143W
  # resistive load (PF 1.00), one channel at a time. ESPHome's ADE7953 defaults assume the
  # Shelly 2.5's shunts, so this board reads current and power about 3.7x low and power
  # with the sign reversed on both channels. the hardware PGA stays at 1x, which is how
  # Tasmota runs this chip on Shelly 2PM boards; scaling in software keeps the full input
  # range for a 10A channel, and the chip's gain registers top out at 2x anyway.
  current_pga_gain: "1x" # ADE7953 current channel hardware gain, 1x/2x/4x/8x/16x/22x
  voltage_multiplier: "0.9811" # 119.7V actual / 122.0V reported
  current_1_multiplier: "3.747" # channel 1 current
  current_2_multiplier: "3.808" # channel 2 current
  power_1_multiplier: "-3.679" # channel 1 power, sign reversed
  power_2_multiplier: "-3.718" # channel 2 power, sign reversed
  max_power: "2400" # Overpower limit per channel in W, up to the 2400 W rating
  max_current: "10" # Overcurrent limit per channel in A, up to the 10 A rating
  max_voltage: "280" # Overvoltage limit in V, up to 280 V
  max_temperature: "95" # Overheating limit in °C on the board NTC; Shelly's documented 95 °C

packages:
  base: !include shelly-gen4-base.yaml
  relay_input_1: !include
    file: shelly-relay-input.yaml
    vars:
      n: ""
      label: " 1"
      relay_id: relay_1
      relay_pin: GPIO5
      relay_name: "Relay 1"
      relay_mode_id: relay_mode_select
      relay_mode_name: "Relay 1 Mode"
      pulse_id: pulse_select
      pulse_name: "Relay 1 Pulse Length"
      input_id: switch_input_1
      input_pin: GPIO11
      input_name: "Switch Input 1"
  relay_input_2: !include
    file: shelly-relay-input.yaml
    vars:
      n: "_2"
      label: " 2"
      relay_id: relay_2
      relay_pin: GPIO3
      relay_name: "Relay 2"
      relay_mode_id: relay_2_mode_select
      relay_mode_name: "Relay 2 Mode"
      pulse_id: pulse_2_select
      pulse_name: "Relay 2 Pulse Length"
      input_id: switch_input_2
      input_pin: GPIO10
      input_name: "Switch Input 2"

# converted devices broadcast this URL. The ESPHome dashboard can offer adoption.
# false keeps adopted stubs as references, every rebuild pulls updates from this repo.
dashboard_import:
  package_import_url: github://Gionames/esphome-shelly-wiz-physical-failsafe/shelly-gen4/configs/shelly-2pm-gen4.yaml@sperimentale
  import_full_config: false

# relays, inputs, Input Mode, Relay Mode and Pulse Length come from shelly-relay-input.yaml
# (one include per channel). here only each channel's protection check at turn-on.
switch:
  - id: !extend relay_1
    # turning on clears the channel's faults, unless voltage or temperature is still over its limit
    on_turn_on:
      - lambda: |-
          bool high = id(sensor_voltage).state > id(max_voltage_number).state;
          bool hot = id(sensor_temperature).get_raw_state() > ${max_temperature};
          id(fault_overpower_1).publish_state(false);
          id(fault_overcurrent_1).publish_state(false);
          id(fault_overvoltage).publish_state(high);
          id(fault_overheating).publish_state(hot);
          if (high || hot) id(relay_1).turn_off();
  - id: !extend relay_2
    on_turn_on:
      - lambda: |-
          bool high = id(sensor_voltage).state > id(max_voltage_number).state;
          bool hot = id(sensor_temperature).get_raw_state() > ${max_temperature};
          id(fault_overpower_2).publish_state(false);
          id(fault_overcurrent_2).publish_state(false);
          id(fault_overvoltage).publish_state(high);
          id(fault_overheating).publish_state(hot);
          if (high || hot) id(relay_2).turn_off();

# protection limits, settable up to the device's rating like stock's.
# Max Power and Max Current apply to each channel.
number:
  - platform: template
    name: "Max Power"
    id: max_power_number
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${max_power}
    min_value: 0
    max_value: 2400
    step: 1
    unit_of_measurement: "W"
    mode: box
  - platform: template
    name: "Max Current"
    id: max_current_number
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${max_current}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: "A"
    mode: box
  - platform: template
    name: "Max Voltage"
    id: max_voltage_number
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${max_voltage}
    min_value: 0
    max_value: 280
    step: 1
    unit_of_measurement: "V"
    mode: box

binary_sensor:
  # onboard button: short press toggles relay 1, long hold factory resets.
  # GPIO12 comes from the ESPHome Devices page only; the Tasmota template has no button.
  - platform: gpio
    name: "Button"
    id: onboard_button
    pin:
      number: GPIO12
      inverted: true
      mode: INPUT_PULLUP
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - switch.toggle: relay_1
      - timing:
          - ON for at least ${factory_reset_hold}
        then:
          - button.press: btn_factory_reset

  # stock's protections. each latches on when it turns its relay off and clears when the
  # relay is turned back on. a trip takes two readings in a row over the limit while on.
  # power and current are per channel; overvoltage and overheating turn both relays off.
  - platform: template
    name: "Overpower 1"
    id: fault_overpower_1
    device_class: problem
  - platform: template
    name: "Overpower 2"
    id: fault_overpower_2
    device_class: problem
  - platform: template
    name: "Overcurrent 1"
    id: fault_overcurrent_1
    device_class: problem
  - platform: template
    name: "Overcurrent 2"
    id: fault_overcurrent_2
    device_class: problem
  - platform: template
    name: "Overvoltage"
    id: fault_overvoltage
    device_class: problem
  - platform: template
    name: "Overheating"
    id: fault_overheating
    device_class: problem

# ADE7953 power meter on I2C. One voltage channel, two current channels (A = relay 1,
# B = relay 2). The Tasmota template drives a reset line on GPIO0; the meter comes up fine
# with that pin left alone, so nothing drives it.
i2c:
  id: i2c_ade7953
  sda: GPIO6
  scl: GPIO7
  frequency: 200kHz

sensor:
  # metering. the chip's gains stay at their defaults; calibration is a multiplier per
  # reading (see docs/CALIBRATION.md). power comes from the chip's
  # own register, not from voltage × current, so it carries its own multiplier. the ADE7953
  # has no energy counter that ESPHome reads out, so energy is integrated from power below.
  - platform: ade7953_i2c
    id: ade7953_meter
    i2c_id: i2c_ade7953
    irq_pin: GPIO1
    update_interval: ${power_update_interval}
    current_pga_gain_a: ${current_pga_gain}
    current_pga_gain_b: ${current_pga_gain}
    voltage:
      name: "Voltage"
      id: sensor_voltage
      entity_category: diagnostic
      filters:
        - multiply: ${voltage_multiplier}
      on_value:
        - lambda: |-
            static uint8_t over = 0;
            over = (id(relay_1).state || id(relay_2).state) && x > id(max_voltage_number).state ? over + 1 : 0;
            if (over >= 2) {
              over = 0;
              id(relay_1).turn_off();
              id(relay_2).turn_off();
              id(fault_overvoltage).publish_state(true);
            }
    frequency:
      name: "Frequency"
      id: sensor_frequency
      accuracy_decimals: 2
      entity_category: diagnostic
    current_a:
      name: "Current 1"
      id: sensor_current_1
      accuracy_decimals: 3
      filters:
        - multiply: ${current_1_multiplier}
      on_value:
        - lambda: |-
            static uint8_t over = 0;
            over = id(relay_1).state && x > id(max_current_number).state ? over + 1 : 0;
            if (over >= 2) {
              over = 0;
              id(relay_1).turn_off();
              id(fault_overcurrent_1).publish_state(true);
            }
    current_b:
      name: "Current 2"
      id: sensor_current_2
      accuracy_decimals: 3
      filters:
        - multiply: ${current_2_multiplier}
      on_value:
        - lambda: |-
            static uint8_t over = 0;
            over = id(relay_2).state && x > id(max_current_number).state ? over + 1 : 0;
            if (over >= 2) {
              over = 0;
              id(relay_2).turn_off();
              id(fault_overcurrent_2).publish_state(true);
            }
    active_power_a:
      name: "Power 1"
      id: sensor_power_1
      filters:
        - multiply: ${power_1_multiplier}
      on_value:
        - lambda: |-
            static uint8_t over = 0;
            over = id(relay_1).state && x > id(max_power_number).state ? over + 1 : 0;
            if (over >= 2) {
              over = 0;
              id(relay_1).turn_off();
              id(fault_overpower_1).publish_state(true);
            }
    active_power_b:
      name: "Power 2"
      id: sensor_power_2
      filters:
        - multiply: ${power_2_multiplier}
      on_value:
        - lambda: |-
            static uint8_t over = 0;
            over = id(relay_2).state && x > id(max_power_number).state ? over + 1 : 0;
            if (over >= 2) {
              over = 0;
              id(relay_2).turn_off();
              id(fault_overpower_2).publish_state(true);
            }

  # energy, integrated from active power. a relay output cannot feed power back, so the
  # integrator sees power clamped at zero; otherwise idle noise or a miscalibrated sign
  # walks the total backwards, which Home Assistant reads as a meter reset. the power
  # sensors themselves stay unclamped so a reversed channel is still visible. the running
  # total is kept in flash so it survives reboots; ESPHome batches those writes to at most
  # one per minute.
  - platform: copy
    source_id: sensor_power_1
    id: power_1_positive
    internal: true
    filters:
      - clamp:
          min_value: 0

  - platform: copy
    source_id: sensor_power_2
    id: power_2_positive
    internal: true
    filters:
      - clamp:
          min_value: 0

  - platform: integration
    name: "Energy 1"
    id: sensor_energy_1
    sensor: power_1_positive
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: integration
    name: "Energy 2"
    id: sensor_energy_2
    sensor: power_2_positive
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # onboard NTC on a 10k divider. the beta value is an estimate, not measured.
  # the base package's "Internal Temperature" is the ESP32-C6 die sensor, not this one.
  - platform: ntc
    name: "Temperature"
    id: sensor_temperature
    sensor: temp_resistance
    entity_category: diagnostic
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: ${ntc_b_constant}
      reference_resistance: 10kOhm
      reference_temperature: 25°C
    # Overheating checks every 10 s reading; Home Assistant still gets one a minute
    filters:
      - throttle: 60s
    on_raw_value:
      - lambda: |-
          static uint8_t over = 0;
          over = (id(relay_1).state || id(relay_2).state) && x > ${max_temperature} ? over + 1 : 0;
          if (over >= 2) {
            over = 0;
            id(relay_1).turn_off();
            id(relay_2).turn_off();
            id(fault_overheating).publish_state(true);
          }

  - platform: resistance
    id: temp_resistance
    sensor: temp_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    internal: true

  - platform: adc
    id: temp_voltage
    update_interval: 10s
    pin: GPIO4
    attenuation: 12db
    internal: true

# Status LED: blinks while Wi-Fi/API are disconnected (setup or reconnecting), off when healthy.
# GPIO18, found by probing every free pin. The Tasmota template's GPIO2 and the ESPHome
# Devices page's GPIO0 both do nothing on this board.
status_led:
  pin:
    number: GPIO18
    inverted: true
