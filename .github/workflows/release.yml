# Compila i modelli Shelly Gen4 e pubblica zip OTA, immagini UART e SHA256SUMS come release.
# Lavoro derivato da shelly-gen4-esphome v1.5.2 (Apache-2.0, Copyright 2026 AUTOMATOUS.IO), vedi NOTICE.
# Si avvia con un tag gen4-v* oppure a mano (workflow_dispatch) indicando la versione.
name: release

on:
  push:
    tags: ["gen4-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. gen4-v1.0.0)"
        required: true
        default: "gen4-v1.0.0"

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          image=$(sed -n 's|^FROM \(ghcr.io/esphome/esphome:.*\)$|\1|p' shelly-gen4/.devcontainer/Dockerfile)
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    needs: toolchain
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        model: [shelly-1pm-mini-gen4, shelly-2pm-gen4]
    defaults:
      run:
        working-directory: shelly-gen4
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.model }}
        run: python3 scripts/build.py ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.model }}
          path: |
            shelly-gen4/gionames-${{ matrix.model }}-esphome-v*-ota.zip
            shelly-gen4/gionames-${{ matrix.model }}-esphome-v*-uart.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum gionames-* > SHA256SUMS
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'N'
          Firmware ESPHome per Shelly Gen4 (derivato da shelly-gen4-esphome v1.5.2, Apache-2.0).
          **Non ancora verificato su hardware**: provare prima su un dispositivo non critico.

          - `*-ota.zip`: da caricare nella pagina di aggiornamento firmware di ShellyOS (il dispositivo deve essere nello slot 1).
          - `*-uart.bin`: immagine completa per esptool via UART (recupero).
          - Verifica i download con `SHA256SUMS`.

          Le immagini firmware includono il runtime C++ di ESPHome (GPLv3): le immagini sono distribuite sotto GPLv3;
          sorgenti: https://github.com/esphome/esphome e questo repository al tag della release. I sorgenti del repository sono Apache-2.0.
          N
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --prerelease --target "$GITHUB_SHA"
          fi
