# BLE: scansione solo passiva e proxy senza connessioni.
# Sovrascrive i valori del package automatous (esp32_ble_tracker active: true,
# bluetooth_proxy active: true). id, continuous e l'interruttore "Bluetooth Proxy"
# a runtime restano quelli del package.
esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false

substitutions:
  ver_ble_passive: "1.0.0"   # versione del package (stampata nel log all'avvio)

esphome:
  on_boot:
    - priority: 900
      then:
        - delay: 9s   # dopo il collegamento del log di rete, altrimenti la riga si perde
        - logger.log:
            format: "pacchetto ble-passive v${ver_ble_passive}"
            level: INFO
            tag: pacchetti
