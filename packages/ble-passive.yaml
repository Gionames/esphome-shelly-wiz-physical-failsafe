# BLE: scansione solo passiva e proxy senza connessioni.
# Sovrascrive i valori del package automatous (esp32_ble_tracker active: true,
# bluetooth_proxy active: true). id, continuous e l'interruttore "Bluetooth Proxy"
# a runtime restano quelli del package.
esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false

substitutions:
  ver_ble_passive: "1.0.0"   # versione del package (stampata nel log all'avvio)

esphome:
  on_boot:
    - priority: 900
      then:
        - delay: 2s   # dopo l'avvio dei componenti, altrimenti lo stato della versione resta vuoto
        - text_sensor.template.publish:
            id: ver_ble_passive_ts
            state: "${ver_ble_passive}"
        - delay: 9s   # dopo il collegamento del log di rete, altrimenti la riga si perde
        - logger.log:
            format: "pacchetto ble-passive v${ver_ble_passive}"
            level: INFO
            tag: pacchetti

text_sensor:
  - platform: template
    name: "Versione - ble-passive"
    id: ver_ble_passive_ts
    icon: mdi:tag-outline
    entity_category: config
    update_interval: never
    web_server:
      sorting_group_id: grp_ver
      sorting_weight: 70
