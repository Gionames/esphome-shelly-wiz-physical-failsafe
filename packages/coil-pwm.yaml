# coil-pwm.yaml
# Relay-coil saving: after the relay has closed, the coil is held with reduced PWM current
# (LEDC, 20 kHz). 100% = original behaviour (no PWM). Needs wiz-physical-failsafe.yaml
# (sorting group grp_diag). Required substitutions:
#   coil_relays  ids of the relay switches, e.g. "relay_1" or "relay_1, relay_2"
#   coil_pins    GPIO numbers driving those coils, same order, e.g. "10" or "5, 3"
# Optional: coil_first_channel (first LEDC channel, default 4; timer 3 is used)
substitutions:
  ver_coil_pwm: "1.0.0"   # versione del package (stampata nel log all'avvio); componente esterno: vedi tag in external_components
  coil_first_channel: "4"

external_components:
  - source: github://Gionames/esphome-shelly-wiz-physical-failsafe@v2.0.0
    components: [coil_pwm]

coil_pwm:
  id: coil_pwm_hub
  relays: "${coil_relays}"
  pins: "${coil_pins}"
  hold_percent: coil_hold_pct
  first_channel: ${coil_first_channel}

number:
  - platform: template
    name: "Bobina relè: mantenimento"
    id: coil_hold_pct
    icon: mdi:sine-wave
    entity_category: config
    unit_of_measurement: "%"
    min_value: 30
    max_value: 100
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 100
    web_server:
      sorting_group_id: grp_rele
      sorting_weight: 10

text_sensor:
  - platform: template
    name: "Versione - coil-pwm"
    id: ver_coil_pwm_ts
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: grp_ver
      sorting_weight: 40
  - platform: template
    name: "Bobina relè: cosa fa"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"Dopo lo scatto il relè resta chiuso con corrente ridotta (PWM): meno calore e consumo"};'
    web_server:
      sorting_group_id: grp_rele
      sorting_weight: 11
  - platform: template
    name: "Bobina relè: scatto"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"Nei primi 200 ms dopo ogni chiusura la bobina è al 100%"};'
    web_server:
      sorting_group_id: grp_rele
      sorting_weight: 12
  - platform: template
    name: "Bobina relè: regolazione"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"Mantenimento da 30 a 100%. 100% = PWM spento (originale)"};'
    web_server:
      sorting_group_id: grp_rele
      sorting_weight: 13
  - platform: template
    name: "Bobina relè: se vibra"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"Se il relè vibra o ricade, alza il valore (60-70%) o torna a 100%"};'
    web_server:
      sorting_group_id: grp_rele
      sorting_weight: 14

esphome:
  on_boot:
    - priority: 900
      then:
        - delay: 2s   # dopo l'avvio dei componenti, altrimenti lo stato della versione resta vuoto
        - text_sensor.template.publish:
            id: ver_coil_pwm_ts
            state: "${ver_coil_pwm}"
        - delay: 9s   # dopo il collegamento del log di rete, altrimenti la riga si perde
        - logger.log:
            format: "pacchetto coil-pwm v${ver_coil_pwm} (componente v2.0.0)"
            level: INFO
            tag: pacchetti
