text_sensor:
  - platform: template
    name: "Timer${wiz_sfx} scade alle"
    id: tmr1_end_text
    icon: mdi:clock-end
    update_interval: 60s
    lambda: |-
      if (id(tmr1_kind) != 0) return {};
      return {"-"};
    web_server:
      sorting_group_id: grp_c1
  - platform: template
    name: "Failsafe ultima attivazione${wiz_sfx}"
    id: fs1_last_text
    icon: mdi:history
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (id(fs1_last_epoch) == 0) return {"mai"};
      return ESPTime::from_epoch_local(id(fs1_last_epoch)).strftime("%d/%m/%Y %H:%M:%S");
    web_server:
      sorting_group_id: grp_c1
  - platform: template
    name: "IP Wiz${wiz_sfx}"
    icon: mdi:ip-network
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"${wiz_ips}"};'
    web_server:
      sorting_group_id: grp_c1
  - platform: wifi_info
    ip_address:
      name: "IP"
      web_server:
        sorting_group_id: grp_diag
    ssid:
      name: "SSID"
      web_server:
        sorting_group_id: grp_diag
    bssid:
      name: "Access point (BSSID)"
      web_server:
        sorting_group_id: grp_diag
  - platform: version
    name: "Versione ESPHome"
    web_server:
      sorting_group_id: grp_diag
  - platform: debug
    reset_reason:
      name: "Motivo ultimo riavvio"
      web_server:
        sorting_group_id: grp_diag

event:
  - platform: template
    name: "Ingresso${wiz_sfx}"
    id: input1_event
    device_class: button
    event_types:
      - premuto
      - rilasciato
      - click
      - doppio_click
      - pressione_lunga
    web_server:
      sorting_group_id: grp_c1

button:
  - platform: safe_mode
    name: "Riavvia in safe mode"
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_diag

time:
  - platform: homeassistant
    id: ha_time

web_server:
  version: 3
  sorting_groups:
    - id: grp_c1
      name: "${wiz_group_name}"
      sorting_weight: 10
    - id: grp_diag
      name: "Diagnostica"
      sorting_weight: 90
