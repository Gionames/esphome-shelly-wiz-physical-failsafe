    entity_category: config
    unit_of_measurement: "K"
    min_value: 2200
    max_value: 6500
    step: 100
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 2700
    web_server:
      sorting_group_id: grp_c1
  - platform: template
