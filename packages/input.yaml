# input.yaml (v4.3.9) - ingresso fisico: modalità interruttore/pulsante, pressione lunga, blocco/inversione.
# Obiettivo: usabile anche con luci non Wiz. ATTENZIONE: per ora chiama ancora sw_changed e variabili del core (wiz-core.yaml); il disaccoppiamento è da fare.
# Richiede wiz-core.

select:
  - platform: template
    name: "Modalità Input"
    id: input_mode_select
    web_server:
      sorting_group_id: grp_ingresso
      sorting_weight: 10
    icon: mdi:light-switch
    entity_category: config
    optimistic: true
    options:
      - "Interruttore: ogni cambio di posizione commuta la luce (Flip)"
      - "Pulsante: ogni pressione commuta la luce (Momentary)"
      - "Interruttore: la luce segue la posizione del tasto (Follow)"
      - "Pulsante: ogni pressione accende, non spegne (Activate)"
      - "Scollegato: l'ingresso non comanda nulla (Detached)"
    initial_option: "Interruttore: ogni cambio di posizione commuta la luce (Flip)"
    restore_value: true
  - platform: template
    name: "Wiz - comando del pulsante"
    id: cmd_timing_select
    web_server:
      sorting_group_id: grp_ingresso
      sorting_weight: 60
    icon: mdi:gesture-tap-button
    entity_category: config
    optimistic: true
    options:
      - "Alla pressione: subito, ma a luce accesa la pressione lunga la spegne prima"
      - "Al rilascio: aggiunge la durata del tocco, nessun lampeggio"
    initial_option: "Alla pressione: subito, ma a luce accesa la pressione lunga la spegne prima"
    restore_value: true
  - platform: template
    name: "Wiz - pressione lunga"
    id: longpress_select
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 10
    icon: mdi:gesture-tap-hold
    entity_category: config
    optimistic: true
    options:
      - "Nessuna azione"
      - "Imposta luminosità e colore alternativi alle Wiz"
      - "Manda l'evento a Home Assistant"
      - "Dimmer: tenendo premuto la luminosità sale o scende"
    initial_option: "Dimmer: tenendo premuto la luminosità sale o scende"
    restore_value: true

binary_sensor:
  # specchio interno del "Switch Input" del package (che non ha id): già con il suo debounce,
  # e mi dà entrambi i fronti. Il package, con Relay Linking = Unlinked, non tocca il relè.
  - platform: template
    id: switch_input_mirror
    internal: true
    lambda: |-
      if (!id(${wiz_input_id}).has_state()) return {};
      // sim_press: tasto simulato da "Wiz - simula pressione lunga" (stesso percorso del tasto fisico)
      return (id(${wiz_input_id}).state != id(input_invert).state) || id(sim_press);
    on_state:
      then:
        - lambda: |-
            bool first = id(sw_last) < 0;
            id(sw_last) = x ? 1 : 0;
            if (first || !id(boot_done)) return;
            if (id(input_lock).state) { id(press_pending) = false; return; }   // ingresso bloccato: nessuna azione
            // indice della modalità: 0 Flip, 1 Momentary, 2 Follow, 3 Activate, 4 Detached
            const int m = id(input_mode_select).active_index().value_or(0);
            const bool push = (m == 1 || m == 3);                         // modalità a pulsante
            const bool on_rel = push && id(cmd_timing_select).active_index().value_or(0) == 1;
            const int lp = id(longpress_select).active_index().value_or(0);   // 0 nessuna, 1 valori alternativi, 2 evento HA, 3 dimmer
            int act = -1;                       // 0 commuta, 1 accendi, 2 spegni
            if (m == 0) act = 0;
            else if (m == 1) { if (x) act = 0; }
            else if (m == 2) act = x ? 1 : 2;
            else if (m == 3) { if (x) act = 1; }
            if (push) {
              if (x) {
                id(lp_done) = false;
                id(press_pending) = false;
                if (lp != 0) id(longpress_wait).execute();
                // "al rilascio": il comando parte al rilascio; in failsafe resta immediato
                if (on_rel && !id(failsafe_mode) && act >= 0) { id(press_pending) = true; id(press_act) = act; return; }
              } else {
                id(longpress_wait).stop();
                if (!id(press_pending)) return;
                id(press_pending) = false;
                if (id(lp_done)) return;        // la pressione lunga ha già agito
                act = id(press_act);
              }
            }
            if (act < 0) return;
            // come lo Shelly: un comando di accensione a luce già accesa fa ripartire l'auto-off
            if (act == 1 && id(light_on_sensor).state && id(auto_off_sw).state) id(tmr_arm).execute(1);
            id(alt_req) = false;
            id(sw_action) = act;
            id(sw_changed).execute();

text_sensor:
  - platform: template
    name: "Versione - input"
    id: ver_input_ts
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: grp_ver
      sorting_weight: 20
  - platform: template
    name: "Wiz - guida comando pulsante"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"Pressione = comando subito (pressione lunga: la luce si spegne e poi passa ai valori alternativi). Rilascio = comando al rilascio, nessun lampeggio ma ritardo pari alla durata del tocco."};'
    web_server:
      sorting_group_id: grp_ingresso
      sorting_weight: 61
  - platform: template
    name: "Wiz - guida pressione lunga"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"Solo in modalità a pulsante. Alla durata impostata: luminosità e colore alternativi (accende se spenta) oppure evento a Home Assistant. In failsafe non agisce."};'
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 11

switch:
  - platform: template
    name: "Blocca ingresso"
    id: input_lock
    icon: mdi:lock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_ingresso
      sorting_weight: 20
  - platform: template
    name: "Inverti ingresso"
    id: input_invert
    icon: mdi:swap-vertical
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # il cambio di inversione fa cambiare lo specchio: quel cambio non deve commutare la luce
    turn_on_action:
      - lambda: 'id(sw_last) = -1;'
    turn_off_action:
      - lambda: 'id(sw_last) = -1;'
    web_server:
      sorting_group_id: grp_ingresso
      sorting_weight: 30

number:
  - platform: template
    name: "Wiz - pressione lunga: durata"
    id: lp_threshold
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0.4
    max_value: 3
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.4
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 20
  - platform: template
    name: "Wiz - dimmer: durata rampa"
    id: dim_ramp_s
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: "s"
    min_value: 1
    max_value: 10
    step: 0.5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 2
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 50
  - platform: template
    name: "Wiz - dimmer: temperatura al minimo"
    id: dim_kmin
    icon: mdi:thermometer-low
    entity_category: config
    unit_of_measurement: "K"
    min_value: 1000
    max_value: 2700
    step: 100
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1000
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 54
  - platform: template
    name: "Wiz - dimmer: intervallo passo"
    id: dim_step
    icon: mdi:timer-cog-outline
    entity_category: config
    unit_of_measurement: "ms"
    min_value: 100
    max_value: 1000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 150
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 53
  - platform: template
    name: "Wiz - dimmer: fase colore, curva del bianco"
    id: dim_wp
    icon: mdi:chart-bell-curve
    entity_category: config
    min_value: 1
    max_value: 8
    step: 0.5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 52
  - platform: template
    name: "Wiz - dimmer: durata rampa colore"
    id: dim_rc
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0.5
    max_value: 10
    step: 0.5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 51

button:
  - platform: template
    name: "Wiz - simula pressione lunga"
    id: sim_btn
    icon: mdi:gesture-tap-hold
    entity_category: config
    web_server:
      sorting_group_id: grp_dimmer
      sorting_weight: 40
    on_press:
      # secondo tocco mentre sta "premendo": rilascia subito
      - if:
          condition:
            script.is_running: sim_hold
          then:
            - script.stop: sim_hold
            - lambda: 'id(sim_press) = false;'
          else:
            - script.execute: sim_hold

event:
  - platform: template
    name: "Ingresso"
    id: input_event
    device_class: button
    event_types:
      - pressione_lunga
    web_server:
      sorting_group_id: grp_ingresso
      sorting_weight: 40

globals:
  - id: dim_y          # fase LED colorati: 0 = nessuno (solo bianco), 1 = rosso puro
    type: float
    initial_value: "0"
  - id: sim_press      # tasto simulato premuto (pulsante "Wiz - simula pressione lunga")
    type: bool
    initial_value: "false"
  # dimmer continuo (pressione lunga, opzione "Dimmer")
  - id: dim_x          # posizione sulla curva, 0 (minimo) - 1 (massimo)
    type: float
    initial_value: "0"
  - id: dim_up         # direzione della rampa: true sale
    type: bool
    initial_value: "true"
  - id: dim_end        # raggiunto un estremo o failsafe: la rampa è finita
    type: bool
    initial_value: "false"
  - id: dim_first      # primo passo partendo da luce spenta
    type: bool
    initial_value: "false"
  - id: dim_pct        # luminosità % del passo corrente
    type: int
    initial_value: "10"
  - id: dim_k          # temperatura (K) del passo corrente, 0 = invariata
    type: int
    initial_value: "0"

script:
  # simula il tasto a muro tenuto premuto: con il dimmer lo tiene premuto finché la rampa non arriva a fine corsa
  # (durata = "Wiz - dimmer: durata rampa" più "durata rampa colore" con la fase LED colorati; limite di sicurezza: +1 s), con le altre azioni lo rilascia subito dopo la soglia
  - id: sim_hold
    mode: single
    then:
      - lambda: 'id(sim_press) = true;'
      - delay: !lambda 'return (uint32_t) (id(lp_threshold).state * 1000.0f) + 300;'
      - wait_until:
          condition:
            lambda: 'return id(dim_end) || id(longpress_select).active_index().value_or(0) != 3;'
          timeout: !lambda 'return (uint32_t) (id(dim_ramp_s).state * 1000.0f + (id(dim_kmin).state < 2200.0f ? id(dim_rc).state * 1000.0f : 0.0f)) + 1000;'
      - lambda: 'id(sim_press) = false;'
  # pressione lunga (solo modalità a pulsante): scatta alla soglia, senza aspettare il rilascio
  - id: longpress_wait
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) (id(lp_threshold).state * 1000);'
      - lambda: |-
          if (id(sw_last) != 1) return;
          id(lp_done) = true;
          id(press_pending) = false;
          const int lp = id(longpress_select).active_index().value_or(0);
          if (lp == 1) {
            // accende (o resta accesa) con luminosità e colore alternativi; in failsafe non c'è nessuna Wiz da comandare
            id(alt_req) = !id(failsafe_mode) && (!id(light_on_sensor).state || !id(alt_on));
            id(sw_action) = 1;
            id(sw_changed).execute();
          } else if (lp == 2) {
            id(input_event).trigger("pressione_lunga");
          } else if (lp == 3) {
            // dimmer continuo: punto di partenza e direzione; la rampa è nell'azione while qui sotto.
            // Direzione: a ogni pressione lunga si inverte; al massimo si scende, al minimo si sale; da spenta accende al minimo e sale.
            id(dim_end) = false;
            id(dim_first) = false;
            if (id(failsafe_mode)) { id(dim_end) = true; } else {
              const bool on = id(light_on_sensor).state;
              if (!on) {
                id(dim_x) = 0.0f; id(dim_y) = 0.0f; id(dim_up) = true; id(dim_first) = true;
              } else {
                int pct = id(lst_bri);
                if (pct <= 0) pct = 100;
                id(dim_x) = std::sqrt(std::max(0.0f, std::min(1.0f, (pct - 10) / 90.0f)));
                if (pct > 10) id(dim_y) = 0.0f;   // fuori dal minimo la fase LED colorati si azzera
                if (pct >= 100) id(dim_up) = false;
                else if (pct <= 10) id(dim_up) = true;
                else id(dim_up) = !id(dim_up);
              }
            }
          }
      # dimmer continuo: finché il tasto resta premuto, un passo ogni "intervallo passo" ms (runtime); il rilascio ferma lo script.
      # Ogni passo è un comando di luminosità (wiz_request): il nuovo comando annulla quello in corso, come per le altre azioni.
      # Curva percettiva: luminosità % = 10 + 90 * x^2, con x da 0 a 1; agli estremi la rampa si ferma senza altro segnale.
      - if:
          condition:
            lambda: 'return id(longpress_select).active_index().value_or(0) == 3 && id(sw_last) == 1 && !id(dim_end);'
          then:
            - while:
                condition:
                  lambda: 'return id(sw_last) == 1 && !id(failsafe_mode) && !id(dim_end);'
                then:
                  - lambda: |-
                      const float rs = std::max(0.5f, id(dim_ramp_s).state);
                      const float step = id(dim_step).state / 1000.0f / rs;
                      const float stepc = id(dim_step).state / 1000.0f / std::max(0.2f, id(dim_rc).state);   // la parte colore ha una durata propria
                      float x = id(dim_x);
                      float y = id(dim_y);
                      if (!id(dim_first)) {   // da spenta il primo passo è proprio x = 0 (10% e temperatura minima), poi si sale
                        if (id(dim_up)) {
                          if (y > 0.0f) y = std::max(0.0f, y - stepc);                               // prima si esce dalla fase LED colorati
                          else { x = std::min(1.0f, x + step); if (x >= 1.0f) id(dim_end) = true; }
                        } else {
                          if (x > 0.0f) {
                            x = std::max(0.0f, x - step);                                           // curva bianca: 100% -> 10%, 2700 K -> temperatura al minimo (>= 2200 K)
                            if (x <= 0.0f && !(id(dim_kmin).state < 2200.0f)) id(dim_end) = true;   // niente LED colorati: la rampa finisce al minimo bianco
                          } else { y = std::min(1.0f, y + stepc); if (y >= 1.0f) id(dim_end) = true; }   // temperatura al minimo < 2200 K e ancora premuto: LED colorati
                        }
                      }
                      id(dim_x) = x;
                      id(dim_y) = y;
                      id(dim_pct) = (int) std::lround(10.0f + 90.0f * x * x);
                      // dim to warm (solo bianco): al massimo di luminosità (x = 1) sempre 2700 K; scendendo la temperatura cala fino a 2200 K al minimo (x = 0).
                      // Sotto 2200 K (temperatura al minimo < 2200) il bianco si ferma a 2200 K e prosegue con i LED colorati (fase y).
                      const float kh = 2700.0f;
                      const float kl = std::min(std::max(id(dim_kmin).state, 2200.0f), kh);
                      id(dim_k) = (int) std::lround(kl + (kh - kl) * x);
                      id(dim_first) = false;
                  - if:
                      condition:
                        lambda: 'return id(dim_y) <= 0.0f;'
                      then:
                        - script.execute:
                            id: wiz_request
                            power: true
                            bri: !lambda 'return id(dim_pct);'
                            kelvin: !lambda 'return id(dim_k);'
                            r: -1
                            g: -1
                            b: -1
                      else:
                        # con temperatura al minimo < 2200 K e tasto ancora premuto al minimo (10%, 2200 K): le Wiz non scendono col bianco, quindi entrano i LED colorati (arancio -> arancio scuro, come il preferito)
                        - lambda: |-
                            // fase LED colorati (y 0 -> 1): dal bianco caldo 2200 K ai soli LED colorati (tono da 255:146:0 a 255:85:0 = 33:11:0, il preferito "arancio scuro").
                            // Il LED bianco rende molta più luce dei colorati: se si spegnesse in modo lineare il colore resterebbe "bianco" fin quasi alla fine e poi
                            // cadrebbe di colpo (il gradino). Il bianco cala quindi con curva (1-y)^p (p = "curva bianco", default 3) e i colorati salgono con y^0,6.
                            // LED blu e bianco freddo sempre spenti. Luminosità (dimming) ferma al minimo.
                            const float y = id(dim_y);
                            const float p = std::max(1.0f, id(dim_wp).state);
                            const float cs = std::pow(y, 0.6f);
                            const int rr = (int) std::lround(255.0f * cs);
                            const int gg = (int) std::lround((146.0f - 61.0f * y) * cs);
                            const int bb = 0;
                            const int ww = (int) std::lround(255.0f * std::pow(1.0f - y, p));
                            if (id(light_on_sensor).state && id(auto_off_sw).state) id(tmr_arm).execute(1);   // come wiz_request: solo con luce accesa e auto-off attivo
                            snprintf(&id(custom_msg)[0], 112, "{\"method\":\"setPilot\",\"params\":{\"state\":true,\"dimming\":%d,\"r\":%d,\"g\":%d,\"b\":%d,\"w\":%d,\"c\":0}}", id(dim_pct), rr, gg, bb, ww);
                            id(custom_bri) = id(dim_pct);
                            id(sw_action) = 3;
                        - script.execute: sw_changed
                  - delay: !lambda 'return (uint32_t) id(dim_step).state;'

substitutions:
  ver_input: "4.3.9"   # versione del package (stampata nel log all'avvio)

esphome:
  on_boot:
    - priority: 900
      then:
        - text_sensor.template.publish:
            id: ver_input_ts
            state: "${ver_input}"
        - delay: 9s   # dopo il collegamento del log di rete, altrimenti la riga si perde
        - logger.log:
            format: "pacchetto input v${ver_input}"
            level: INFO
            tag: pacchetti
