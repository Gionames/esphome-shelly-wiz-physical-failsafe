# input.yaml (v4.0.1) - ingresso fisico: modalità interruttore/pulsante, pressione lunga, blocco/inversione.
# Obiettivo: usabile anche con luci non Wiz. ATTENZIONE: per ora chiama ancora sw_changed e variabili del core (wiz-core.yaml); il disaccoppiamento è da fare.
# Richiede wiz-core.

select:
  - platform: template
    name: "Modalità Input"
    id: input_mode_select
    web_server:
      sorting_group_id: grp_ingresso
    icon: mdi:light-switch
    entity_category: config
    optimistic: true
    options:
      - "Interruttore: ogni cambio di posizione commuta la luce (Flip)"
      - "Pulsante: ogni pressione commuta la luce (Momentary)"
      - "Interruttore: la luce segue la posizione del tasto (Follow)"
      - "Pulsante: ogni pressione accende, non spegne (Activate)"
      - "Scollegato: l'ingresso non comanda nulla (Detached)"
    initial_option: "Interruttore: ogni cambio di posizione commuta la luce (Flip)"
    restore_value: true
  - platform: template
    name: "Wiz - comando del pulsante"
    id: cmd_timing_select
    web_server:
      sorting_group_id: grp_ingresso
    icon: mdi:gesture-tap-button
    entity_category: config
    optimistic: true
    options:
      - "Alla pressione: subito, ma a luce accesa la pressione lunga la spegne prima"
      - "Al rilascio: aggiunge la durata del tocco, nessun lampeggio"
    initial_option: "Alla pressione: subito, ma a luce accesa la pressione lunga la spegne prima"
    restore_value: true
  - platform: template
    name: "Wiz - pressione lunga"
    id: longpress_select
    web_server:
      sorting_group_id: grp_ingresso
    icon: mdi:gesture-tap-hold
    entity_category: config
    optimistic: true
    options:
      - "Nessuna azione"
      - "Imposta luminosità e colore alternativi alle Wiz"
      - "Manda l'evento a Home Assistant"
    initial_option: "Imposta luminosità e colore alternativi alle Wiz"
    restore_value: true

binary_sensor:
  # specchio interno del "Switch Input" del package (che non ha id): già con il suo debounce,
  # e mi dà entrambi i fronti. Il package, con Relay Linking = Unlinked, non tocca il relè.
  - platform: template
    id: switch_input_mirror
    internal: true
    lambda: |-
      if (!id(${wiz_input_id}).has_state()) return {};
      return id(${wiz_input_id}).state != id(input_invert).state;
    on_state:
      then:
        - lambda: |-
            bool first = id(sw_last) < 0;
            id(sw_last) = x ? 1 : 0;
            if (first || !id(boot_done)) return;
            if (id(input_lock).state) { id(press_pending) = false; return; }   // ingresso bloccato: nessuna azione
            // indice della modalità: 0 Flip, 1 Momentary, 2 Follow, 3 Activate, 4 Detached
            const int m = id(input_mode_select).active_index().value_or(0);
            const bool push = (m == 1 || m == 3);                         // modalità a pulsante
            const bool on_rel = push && id(cmd_timing_select).active_index().value_or(0) == 1;
            const int lp = id(longpress_select).active_index().value_or(0);   // 0 nessuna, 1 valori alternativi, 2 evento HA
            int act = -1;                       // 0 commuta, 1 accendi, 2 spegni
            if (m == 0) act = 0;
            else if (m == 1) { if (x) act = 0; }
            else if (m == 2) act = x ? 1 : 2;
            else if (m == 3) { if (x) act = 1; }
            if (push) {
              if (x) {
                id(lp_done) = false;
                id(press_pending) = false;
                if (lp != 0) id(longpress_wait).execute();
                // "al rilascio": il comando parte al rilascio; in failsafe resta immediato
                if (on_rel && !id(failsafe_mode) && act >= 0) { id(press_pending) = true; id(press_act) = act; return; }
              } else {
                id(longpress_wait).stop();
                if (!id(press_pending)) return;
                id(press_pending) = false;
                if (id(lp_done)) return;        // la pressione lunga ha già agito
                act = id(press_act);
              }
            }
            if (act < 0) return;
            // come lo Shelly: un comando di accensione a luce già accesa fa ripartire l'auto-off
            if (act == 1 && id(light_on_sensor).state && id(auto_off_sw).state) id(tmr_arm).execute(1);
            id(alt_req) = false;
            id(sw_action) = act;
            id(sw_changed).execute();

text_sensor:
  - platform: template
    name: "Wiz - guida comando pulsante"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"Pressione = comando subito (pressione lunga: la luce si spegne e poi passa ai valori alternativi). Rilascio = comando al rilascio, nessun lampeggio ma ritardo pari alla durata del tocco."};'
    web_server:
      sorting_group_id: grp_diag
  - platform: template
    name: "Wiz - guida pressione lunga"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"Solo in modalità a pulsante. Alla durata impostata: luminosità e colore alternativi (accende se spenta) oppure evento a Home Assistant. In failsafe non agisce."};'
    web_server:
      sorting_group_id: grp_diag

switch:
  - platform: template
    name: "Blocca ingresso"
    id: input_lock
    icon: mdi:lock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_ingresso
  - platform: template
    name: "Inverti ingresso"
    id: input_invert
    icon: mdi:swap-vertical
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # il cambio di inversione fa cambiare lo specchio: quel cambio non deve commutare la luce
    turn_on_action:
      - lambda: 'id(sw_last) = -1;'
    turn_off_action:
      - lambda: 'id(sw_last) = -1;'
    web_server:
      sorting_group_id: grp_ingresso

number:
  - platform: template
    name: "Wiz - pressione lunga: durata"
    id: lp_threshold
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0.4
    max_value: 3
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1
    web_server:
      sorting_group_id: grp_ingresso

event:
  - platform: template
    name: "Ingresso"
    id: input_event
    device_class: button
    event_types:
      - pressione_lunga
    web_server:
      sorting_group_id: grp_ingresso

script:
  # pressione lunga (solo modalità a pulsante): scatta alla soglia, senza aspettare il rilascio
  - id: longpress_wait
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) (id(lp_threshold).state * 1000);'
      - lambda: |-
          if (id(sw_last) != 1) return;
          id(lp_done) = true;
          id(press_pending) = false;
          const int lp = id(longpress_select).active_index().value_or(0);
          if (lp == 1) {
            // accende (o resta accesa) con luminosità e colore alternativi; in failsafe non c'è nessuna Wiz da comandare
            id(alt_req) = !id(failsafe_mode) && (!id(light_on_sensor).state || !id(alt_on));
            id(sw_action) = 1;
            id(sw_changed).execute();
          } else if (lp == 2) {
            id(input_event).trigger("pressione_lunga");
          }

substitutions:
  ver_input: "4.0.1"   # versione del package (stampata nel log all'avvio)

esphome:
  on_boot:
    - priority: 900
      then:
        - logger.log:
            format: "pacchetto input v${ver_input}"
            level: INFO
            tag: pacchetti
