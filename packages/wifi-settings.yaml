# wifi-settings.yaml  (v1.4.0)
# Impostazioni Wi-Fi modificabili da Home Assistant (device info) e dalla pagina web, con due reti (come ShellyOS).
# Funziona su qualunque ESPHome che abbia gia' il blocco "wifi:" (con le sue reti in YAML come punto di partenza).
#
# Entita' create (gruppo "Wi-Fi"):
#   Wi-Fi 1 - SSID / password   rete preferita
#   Wi-Fi 2 - SSID / password   rete di riserva
#   Applica Wi-Fi               prova subito la rete 1 (poi la 2); se nessuna risponde, resta sulla rete attuale
#   Wi-Fi - stato               ultimo esito dei tentativi
# Regole:
#   - campi vuoti = nessun cambiamento: il dispositivo usa la rete scritta nello YAML.
#   - all'avvio, se la rete 1 e' impostata e diversa da quella attuale, viene applicata (e salvata).
#   - se manca il Wi-Fi e le due reti sono impostate, ogni 10 s (wifi_rotate_s) prova l'altra rete, e cosi' via a giro.
#   - se il Wi-Fi manca per piu' di "Wi-Fi - riavvia radio dopo" (default 60 s) spegne e riaccende la sola radio Wi-Fi
#     (nessun riavvio del dispositivo: relè e luci non vengono toccati) e riparte dalla rete 1.
#   - i valori sono ricordati dopo riavvii e aggiornamenti OTA (restore_value).
# ATTENZIONE: le password sono entita' di testo: Home Assistant ne conserva il valore nel suo storico
# e la pagina web del dispositivo e' senza autenticazione. Usare solo su rete locale fidata.
substitutions:
  # valori iniziali dei campi (usati solo al primo avvio, finche' non li cambi da HA o dalla pagina web).
  # NON scrivere password in chiaro nel repo: nel YAML del device usa !secret.
  wifi1_ssid: ""
  wifi1_pass: ""
  wifi2_ssid: ""
  wifi2_pass: ""
  wifi_apply_timeout: "30s"     # attesa massima per collegarsi a una rete durante un tentativo
  wifi_rotate_s: "10"           # secondi senza Wi-Fi prima di provare l'altra rete (e poi a giro, ogni tanti secondi)
  wifi_cycle_timeout: "60"      # valore iniziale (modificabile da HA/pagina web): secondi senza Wi-Fi prima di spegnere e riaccendere la radio
  wifi_pass_mode: "text"        # "text" = password visibili; "password" = nascoste

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 20s
      - lambda: 'id(wifi_busy) = false;'
      - if:
          condition:
            lambda: 'return !id(wifi1_ssid).state.empty();'
          then:
            - script.execute:
                id: wifi_start
                first: 1
                save: true

globals:
  - id: wifi_first       # prima rete da provare (1 o 2)
    type: int
    initial_value: "1"
  - id: wifi_second
    type: int
    initial_value: "2"
  - id: wifi_step        # quanti tentativi del piano sono gia' stati presi in carico (0..2)
    type: int
    initial_value: "0"
  - id: wifi_try         # rete in prova (0 = nessuna)
    type: int
    initial_value: "0"
  - id: wifi_save        # true = salva la rete (sopravvive al riavvio), false = solo finche' acceso
    type: bool
    initial_value: "false"
  - id: wifi_slot        # rete in uso (0 = quella dello YAML)
    type: int
    initial_value: "0"
  - id: wifi_busy
    type: bool
    initial_value: "false"
  - id: wifi_busy_since
    type: uint32_t
    initial_value: "0"
  - id: wifi_down_s      # secondi consecutivi senza Wi-Fi
    type: int
    initial_value: "0"
  - id: wifi_cycling     # true mentre la radio Wi-Fi e' spenta di proposito
    type: bool
    initial_value: "false"

text:
  - platform: template
    name: "Wi-Fi 1 - SSID"
    id: wifi1_ssid
    icon: mdi:wifi
    entity_category: config
    mode: text
    min_length: 0
    max_length: 32
    optimistic: true
    restore_value: true
    initial_value: "${wifi1_ssid}"
    web_server:
      sorting_group_id: grp_wifi
      sorting_weight: 10
  - platform: template
    name: "Wi-Fi 1 - password"
    id: wifi1_pass
    icon: mdi:form-textbox-password
    entity_category: config
    mode: ${wifi_pass_mode}
    min_length: 0
    max_length: 63
    optimistic: true
    restore_value: true
    initial_value: "${wifi1_pass}"
    web_server:
      sorting_group_id: grp_wifi
      sorting_weight: 20
  - platform: template
    name: "Wi-Fi 2 - SSID"
    id: wifi2_ssid
    icon: mdi:wifi-star
    entity_category: config
    mode: text
    min_length: 0
    max_length: 32
    optimistic: true
    restore_value: true
    initial_value: "${wifi2_ssid}"
    web_server:
      sorting_group_id: grp_wifi
      sorting_weight: 30
  - platform: template
    name: "Wi-Fi 2 - password"
    id: wifi2_pass
    icon: mdi:form-textbox-password
    entity_category: config
    mode: ${wifi_pass_mode}
    min_length: 0
    max_length: 63
    optimistic: true
    restore_value: true
    initial_value: "${wifi2_pass}"
    web_server:
      sorting_group_id: grp_wifi
      sorting_weight: 40

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_cur_ssid
      internal: true
  - platform: template
    name: "Wi-Fi - stato"
    id: wifi_status_ts
    icon: mdi:wifi-cog
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_wifi
      sorting_weight: 60

number:
  - platform: template
    name: "Wi-Fi - riavvia radio dopo"
    id: wifi_cycle_s
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: "s"
    mode: box
    min_value: 20
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true
    initial_value: ${wifi_cycle_timeout}
    web_server:
      sorting_group_id: grp_wifi
      sorting_weight: 45

button:
  - platform: template
    name: "Wi-Fi - applica impostazioni SSID/PW"
    id: wifi_apply_btn
    icon: mdi:wifi-sync
    entity_category: config
    on_press:
      - lambda: 'id(wifi_busy) = false;'
      - script.execute:
          id: wifi_start
          first: 1
          save: true
    web_server:
      sorting_group_id: grp_wifi
      sorting_weight: 50

web_server:
  version: 3
  sorting_groups:
    - id: grp_wifi
      name: "Wi-Fi"
      sorting_weight: 90

script:
  # piano: prova "first" poi l'altra rete; "save" = rendi permanente la rete che funziona
  - id: wifi_start
    mode: restart
    parameters:
      first: int
      save: bool
    then:
      - if:
          condition:
            lambda: 'return !(id(wifi_busy) && (millis() - id(wifi_busy_since) < 120000));'
          then:
            - lambda: |-
                id(wifi_busy) = true;
                id(wifi_busy_since) = millis();
                id(wifi_first) = first;
                id(wifi_second) = (first == 1) ? 2 : 1;
                id(wifi_step) = 0;
                id(wifi_save) = save;
            - script.execute: wifi_next

  - id: wifi_next
    mode: restart
    then:
      # sceglie la prossima rete del piano che abbia un SSID impostato
      - lambda: |-
          int s = 0;
          while (id(wifi_step) < 2) {
            int cand = (id(wifi_step) == 0) ? id(wifi_first) : id(wifi_second);
            id(wifi_step)++;
            std::string ssid = (cand == 1) ? id(wifi1_ssid).state : id(wifi2_ssid).state;
            if (ssid.empty()) continue;
            s = cand;
            break;
          }
          id(wifi_try) = s;
      - if:
          condition:
            lambda: 'return id(wifi_try) == 0;'
          then:
            - lambda: |-
                id(wifi_busy) = false;
                id(wifi_status_ts).publish_state("Nessuna rete utilizzabile: resto sulla rete attuale");
          else:
            - if:
                condition:
                  lambda: |-
                    std::string ssid = (id(wifi_try) == 1) ? id(wifi1_ssid).state : id(wifi2_ssid).state;
                    return wifi::global_wifi_component->is_connected() && id(wifi_cur_ssid).state == ssid;
                then:
                  - lambda: |-
                      id(wifi_slot) = id(wifi_try);
                      id(wifi_busy) = false;
                      std::string m = "Collegato alla rete " + std::to_string(id(wifi_try)) + ": " + id(wifi_cur_ssid).state;
                      id(wifi_status_ts).publish_state(m);
                else:
                  - lambda: |-
                      std::string m = "Provo la rete " + std::to_string(id(wifi_try)) + "...";
                      id(wifi_status_ts).publish_state(m);
                  - wifi.configure:
                      ssid: !lambda 'return (id(wifi_try) == 1) ? id(wifi1_ssid).state : id(wifi2_ssid).state;'
                      password: !lambda 'return (id(wifi_try) == 1) ? id(wifi1_pass).state : id(wifi2_pass).state;'
                      save: !lambda 'return id(wifi_save);'
                      timeout: ${wifi_apply_timeout}
                      on_connect:
                        - lambda: |-
                            id(wifi_slot) = id(wifi_try);
                            id(wifi_busy) = false;
                            std::string m = "Collegato alla rete " + std::to_string(id(wifi_try)) + ": " + id(wifi_cur_ssid).state;
                            id(wifi_status_ts).publish_state(m);
                      on_error:
                        - lambda: |-
                            std::string m = "Rete " + std::to_string(id(wifi_try)) + " non raggiungibile";
                            id(wifi_status_ts).publish_state(m);
                        - script.execute: wifi_next

  # prova l'altra rete ogni wifi_rotate_s secondi senza Wi-Fi; oltre "riavvia radio dopo" spegne e riaccende il Wi-Fi
  - id: wifi_hop
    mode: restart
    parameters:
      target: int       # 1 o 2 = rete da provare; 0 = stessa rete (solo spegni/riaccendi)
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (target > 0) {
            wifi::WiFiAP ap;
            ap.set_ssid(target == 1 ? id(wifi1_ssid).state : id(wifi2_ssid).state);
            ap.set_password(target == 1 ? id(wifi1_pass).state : id(wifi2_pass).state);
            w->disable();
            w->set_sta(ap);
            w->enable();
            id(wifi_slot) = target;
            ESP_LOGW("wifi", "provo la rete %d", target);
          } else {
            w->disable();
            w->enable();
          }

  - id: wifi_cycle
    mode: single
    then:
      - lambda: |-
          id(wifi_cycling) = true;
          ESP_LOGW("wifi", "senza Wi-Fi da %d s: spengo e riaccendo la radio Wi-Fi", id(wifi_down_s));
          id(wifi_down_s) = 0;
          wifi::global_wifi_component->disable();
      - delay: 3s
      - lambda: 'id(wifi_hop).execute(id(wifi1_ssid).state.empty() ? 0 : 1);'
      - lambda: 'id(wifi_cycling) = false;'

interval:
  - interval: 1s
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (id(wifi_cycling)) return;
          if (w->is_connected()) {
            id(wifi_down_s) = 0;
            const std::string &cur = id(wifi_cur_ssid).state;
            if (!cur.empty()) id(wifi_slot) = (cur == id(wifi1_ssid).state) ? 1 : (cur == id(wifi2_ssid).state) ? 2 : 0;
            return;
          }
          if (w->is_disabled()) return;
          id(wifi_down_s)++;
          if (id(wifi_busy) && (millis() - id(wifi_busy_since) < 120000)) return;   // c'e' gia' un'applicazione in corso
          const int d = id(wifi_down_s);
          if (d >= (int) id(wifi_cycle_s).state) {
            id(wifi_cycle).execute();
          } else if (d % ${wifi_rotate_s} == 0 && !id(wifi1_ssid).state.empty() && !id(wifi2_ssid).state.empty()) {
            id(wifi_hop).execute(id(wifi_slot) == 1 ? 2 : 1);
          }
